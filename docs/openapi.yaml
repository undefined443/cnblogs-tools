                pageSize: 10
                enableScript: false
      tags:
        - Blogs
      description: Get blog information
      parameters:
        - name: blogApp
          in: path
          required: true
          schema:
            type: string
          description: Blog name
  /api/Bookmarks:
    head:
      summary: Check whether a bookmark exists by URL
      operationId: operation_0120bc7d780d880351c4fd5ed85e4e61
      responses:
        default:
          description: The source does not specify the response status code.
      tags:
        - Bookmarks
      description: 'Check whether a bookmark exists by URL.

        The same path also documents retrieving the bookmark count from the X-Count response header. See x-source-variants.'
      parameters:
        - name: url
          in: query
          schema:
            type: string
          description: Bookmark URL
          required: false
      x-source-variants:
        - summary: Get the bookmark count from the X-Count response header
          operationId: operation_efb5ebc659592f7adc9d8bdcf63ad9ab
          responses:
            default:
              description: The source does not specify the response status code.
          tags:
            - Bookmarks
          description: Get the bookmark count from the X-Count response header
    delete:
      summary: Delete a bookmark by URL; the URL must be encoded.
      operationId: operation_877c3d63eca66b655ca1d0ca8040e4df
      responses:
        default:
          description: The source does not specify the response status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  Version:
                    type: string
                  Content:
                    type: string
                  StatusCode:
                    type: string
                  ReasonPhrase:
                    type: string
                  Headers:
                    type: string
                  RequestMessage:
                    type: string
                  IsSuccessStatusCode:
                    type: string
      tags:
        - Bookmarks
      description: Delete a bookmark by URL; the URL must be encoded.
      parameters:
        - name: url
          in: query
          schema:
            type: string
          description: Bookmark ID
          required: true
    post:
      summary: Add a bookmark
      operationId: operation_8dd88bf68b184e0d0cdae1a4572d13a7
      responses:
        default:
          description: The source does not specify the response status code.
      tags:
        - Bookmarks
      description: Add a bookmark
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                WzLinkId:
                  type: integer
                Title:
                  type: string
                LinkUrl:
                  type: string
                Summary:
                  type: string
                Tags:
                  type: array
                  items:
                    type: string
            example:
              WzLinkId: 1
              Title: sample string 2
              LinkUrl: sample string 3
              Summary: sample string 4
              Tags:
                - sample string 1
                - sample string 2
    get:
      summary: List bookmarks with pagination
      operationId: operation_9d7f798157026e79f8dc360c3c1dece2
      responses:
        default:
          description: The source does not specify the response status code.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    WzLinkId:
                      type: integer
                    Title:
                      type: string
                    LinkUrl:
                      type: string
                    Summary:
                      type: string
                    Tags:
                      type: array
                      items:
                        type: string
                    DateAdded:
                      type: string
                    FromCNBlogs:
                      type: boolean
              example:
                - WzLinkId: 1
                  Title: sample string 2
                  LinkUrl: sample string 3
                  Summary: sample string 4
                  Tags:
                    - sample string 1
                    - sample string 2
                  DateAdded: '2017-06-25T19:42:03.8765962+08:00'
                  FromCNBlogs: true
                - WzLinkId: 1
                  Title: sample string 2
                  LinkUrl: sample string 3
                  Summary: sample string 4
                  Tags:
                    - sample string 1
                    - sample string 2
                  DateAdded: '2017-06-25T19:42:03.8765962+08:00'
                  FromCNBlogs: true
      tags:
        - Bookmarks
      description: List bookmarks with pagination
      parameters:
