                      type: string
                    VoteTimes:
                      type: integer
                    ViewTimes:
                      type: integer
                    CommentTimes:
                      type: integer
                    Uri:
                      type: string
                    Id:
                      type: string
              example:
                - Title: sample string 1
                  Content: sample string 2
                  UserName: sample string 3
                  UserAlias: sample string 4
                  PublishTime: '2017-06-25T10:03:46.4250727+08:00'
                  VoteTimes: 6
                  ViewTimes: 7
                  CommentTimes: 8
                  Uri: sample string 9
                  Id: sample string 10
                - Title: sample string 1
                  Content: sample string 2
                  UserName: sample string 3
                  UserAlias: sample string 4
                  PublishTime: '2017-06-25T10:03:46.4250727+08:00'
                  VoteTimes: 6
                  ViewTimes: 7
                  CommentTimes: 8
                  Uri: sample string 9
                  Id: sample string 10
      tags:
        - ZzkDocument
      description: 'Search results:

        An empty keyword returns HTTP 400 Bad Request.

        An unsupported search category returns HTTP 400 Bad Request.

        No matching results returns HTTP 200 OK with empty HttpContent.'
