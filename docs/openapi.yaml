openapi: 3.1.0
info:
  title: Cnblogs Open API
  version: 1.0.0
  description: 'API reference: https://api.cnblogs.com/help'
externalDocs:
  url: https://api.cnblogs.com/help
servers:
  - url: https://api.cnblogs.com
paths:
  /token:
    post:
      summary: 1 Client credentials authorization
      operationId: operation_7d5a38d78c59a88895be1dd5069a41fa
      responses:
        default:
          description: The source does not specify the response status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    type: string
              example:
                access_token: this token string
                expires_in: 86400
                token_type: Bearer
      tags:
        - Token
      description: Obtain a token using the client_credentials grant.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Client ID
                client_secret:
                  type: string
                  description: Client secret
                grant_type:
                  type: string
                  description: Grant type
              required:
                - client_id
                - client_secret
                - grant_type
  /connect/authorize:
    post:
      summary: 2.1 Obtain an authorization code
      operationId: operation_e342fa1ac6ccd275bd0fa12b20771a7b
      responses:
        default:
          description: The source does not specify the response status code.
      tags:
        - Token
      servers:
        - url: https://oauth.cnblogs.com
      description:
        '1. Open this URL in a browser to reach the Cnblogs sign-in page.

        2. After sign-in, the browser redirects to https://oauth.cnblogs.com/auth/callback (the default callback) with a code
        parameter.

        3. Exchange the code from the URL for a token; see section 2.2, Authorization code authorization.'
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Registered client_id
                scope:
                  type: string
                  description: Requested scopes
                response_type:
                  type: string
                  description: Response type
                redirect_uri:
                  type: string
                  description: Default callback URL; contact the administrator to change it.
                state:
                  type: string
                  description: An arbitrary value; required.
                nonce:
                  type: string
                  description: A random string generated by the client.
              required:
                - client_id
                - scope
                - response_type
                - redirect_uri
                - state
                - nonce
  /connect/token:
    post:
      summary: 2.2 Authorization code authorization
      operationId: operation_ef5e9a930b32d1421ef1168f30edffb1
      responses:
        default:
          description: The source does not specify the response status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                  token_type:
                    type: string
                  refresh_token:
                    type: string
              example:
                access_token: this is token string
                expires_in: 586400
                token_type: Bearer
                refresh_token: this is refresh token string
      tags:
        - Token
      servers:
        - url: https://oauth.cnblogs.com
      description: The user must sign in to obtain a code. See the authorization code documentation.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Client ID
                client_secret:
                  type: string
                  description: Secret
                grant_type:
                  type: string
                  description: Grant type
                code:
                  type: string
                  description: Authorization code
                redirect_uri:
                  type: string
                  description: Callback URL (default)
              required:
                - client_id
                - client_secret
                - grant_type
                - code
                - redirect_uri
  /api/users:
    get:
      summary: Get the signed-in user's information
      operationId: operation_4e598eb53dda7bd5ed0291edd7155871
      responses:
        default:
          description: The source does not specify the response status code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  UserId:
                    type: string
                  SpaceUserId:
                    type: integer
                  BlogId:
                    type: integer
                  DisplayName:
                    type: string
                  Face:
                    type: string
                  Avatar:
                    type: string
                  Seniority:
                    type: string
                  BlogApp:
                    type: string
              example:
                UserId: 4566ea6b-f2b3
                SpaceUserId: 2
                BlogId: 3
                DisplayName: sample string 4
                Face: sample string 5
                Avatar: sample string 6
                Seniority: sample string 7
                BlogApp: sample string 8
      tags:
        - Users
      description: Get the signed-in user's information
      security:
        - bearerAuth: []
  /api/blogs/{blogApp}:
