        - name: category
          in: path
          required: true
          schema:
            type: string
          description: Search category
        - name: keyWords
          in: query
          schema:
            type: string
          description: Search keywords
          required: true
        - name: pageIndex
          in: query
          schema:
            type: number
          description: Page number to return. Defaults to 1 when omitted.
          required: true
        - name: startDate
          in: query
          schema: {}
          description: 'Start date. If omitted, include all matching dates. Format: 2015-09-09.'
          required: true
        - name: endDate
          in: query
          schema: {}
          description: 'End date. Defaults to the current date when omitted. Format: 2015-09-09.'
          required: true
        - name: viewTimesAtLeast
          in: query
          schema:
            type: string
          description: Search content with a view count above this value.
