name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Check formatting and lint
        run: uv run --locked pre-commit run --all-files
      - name: Run tests
        run: uv run --locked -m unittest discover -s tests
